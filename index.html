<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>محاضرات 8/8</title>
<meta name="description" content="محاضرات الفرقة الرابعة محاسبة — المعهد المصري لأكاديمية الإسكندرية">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap">
<style>
:root{
  --bg:#f3f5f0; --surface:#fff; --ink:#17211c; --muted:#5f6d65; --rule:#cfd8cd;
  --accent:#1f6b4f; --accent-ink:#fff; --soft:#e4efe8; --hover:#f7faf6;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0e1411; --surface:#161f1a; --ink:#e7ede8; --muted:#97a69c; --rule:#2b3a31;
    --accent:#52c28f; --accent-ink:#0c1a13; --soft:#1d2c24; --hover:#1a251f;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0e1411; --surface:#161f1a; --ink:#e7ede8; --muted:#97a69c; --rule:#2b3a31;
  --accent:#52c28f; --accent-ink:#0c1a13; --soft:#1d2c24; --hover:#1a251f;
  color-scheme:dark;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-padding-top:150px}
body{
  font-family:'IBM Plex Sans Arabic','Segoe UI',Tahoma,Arial,sans-serif;
  background:var(--bg);color:var(--ink);line-height:1.6;
  padding-top:env(safe-area-inset-top,0px);
}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.wrap{max-width:860px;margin:0 auto;padding-inline:max(18px,env(safe-area-inset-right,0px)) max(18px,env(safe-area-inset-left,0px))}

/* Masthead */
.mast{padding-block:36px 22px;display:flex;justify-content:space-between;align-items:flex-start;gap:16px}
.mast h1{
  font-size:clamp(2rem,6vw,3rem);font-weight:700;line-height:1.15;letter-spacing:-.01em;
  display:inline-block;padding-bottom:6px;
  border-bottom:4px double var(--accent);   /* double underline = accounting "total" mark */
}
.mast p{margin-top:12px;color:var(--muted);font-size:.95rem;max-width:34ch}
.theme{
  flex-shrink:0;width:42px;height:42px;border-radius:50%;border:1px solid var(--rule);
  background:var(--surface);color:var(--ink);font-size:18px;cursor:pointer;
}
.theme:hover{border-color:var(--accent)}

/* Sticky tools */
.tools{
  position:sticky;top:env(safe-area-inset-top,0px);z-index:20;
  background:var(--bg);padding-block:10px 12px;border-bottom:1px solid var(--rule);
}
.search{position:relative}
.search input{
  width:100%;height:46px;padding:0 44px 0 16px;border-radius:10px;
  border:1px solid var(--rule);background:var(--surface);color:var(--ink);
  font:inherit;font-size:.95rem;
}
.search input::placeholder{color:var(--muted)}
.search input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--soft)}
.search svg{position:absolute;right:14px;top:50%;transform:translateY(-50%);width:18px;height:18px;color:var(--muted)}
.chips{display:flex;gap:8px;margin-top:10px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{
  flex-shrink:0;padding:6px 14px;border-radius:999px;border:1px solid var(--rule);
  background:var(--surface);color:var(--ink);font:inherit;font-size:.85rem;font-weight:500;cursor:pointer;
}
.chip:hover{border-color:var(--accent)}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}

/* Subjects */
main{padding-block:8px 72px}
.subject{margin-top:28px}
.subject summary{
  list-style:none;cursor:pointer;display:flex;align-items:center;gap:12px;
  padding-block:10px;border-bottom:4px double var(--rule);
}
.subject summary::-webkit-details-marker{display:none}
.s-icon{font-size:22px;width:36px;text-align:center}
.s-name{font-size:1.2rem;font-weight:700;flex:1}
.s-count{font-size:.82rem;color:var(--muted);font-variant-numeric:tabular-nums}
.s-caret{width:16px;height:16px;color:var(--muted);transition:transform .2s}
.subject[open] .s-caret{transform:rotate(180deg)}

/* Lecture rows (ledger style) */
.lec{
  display:grid;grid-template-columns:64px 1fr auto;align-items:center;gap:6px 14px;
  padding:14px 4px;border-bottom:1px solid var(--rule);
}
.lec:hover{background:var(--hover)}
.num{text-align:center;line-height:1.2}
.num b{display:block;font-size:1.5rem;font-weight:700;color:var(--accent);font-variant-numeric:tabular-nums}
.num span{font-size:.72rem;color:var(--muted)}
.title{font-size:.98rem;font-weight:600;line-height:1.5}
.acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.btn{
  display:inline-flex;align-items:center;justify-content:center;height:36px;padding:0 14px;
  border-radius:8px;border:1px solid var(--rule);background:var(--surface);color:var(--ink);
  font:inherit;font-size:.82rem;font-weight:600;text-decoration:none;cursor:pointer;white-space:nowrap;
}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{opacity:.9}

.empty{text-align:center;padding:64px 16px;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-size:1.05rem;margin-bottom:4px}

/* AI menu */
.menu{
  position:fixed;z-index:100;min-width:200px;background:var(--surface);color:var(--ink);
  border:1px solid var(--rule);border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,.2);overflow:hidden;
}
.menu small{display:block;padding:10px 14px 4px;color:var(--muted);font-size:.75rem}
.menu a{display:block;padding:11px 14px;color:inherit;text-decoration:none;font-weight:600;font-size:.9rem}
.menu a:hover{background:var(--soft)}

@media (max-width:620px){
  .lec{grid-template-columns:48px 1fr}
  .acts{grid-column:1 / -1;justify-content:flex-start}
  .btn{flex:1;min-width:0}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<div class="wrap">
  <header class="mast">
    <div>
      <h1>محاضرات 8/8</h1>
      <p>المعهد المصري لأكاديمية الإسكندرية، الفرقة الرابعة محاسبة</p>
    </div>
    <button class="theme" id="themeBtn" aria-label="تبديل الوضع الداكن">🌓</button>
  </header>
</div>

<div class="tools">
  <div class="wrap">
    <label class="search">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input type="search" id="q" placeholder="ابحث عن محاضرة أو مادة" autocomplete="off">
    </label>
    <div class="chips" id="chips"></div>
  </div>
</div>

<main class="wrap" id="main"></main>

<script>
const BASE = "https://youssefashraf50.github.io/lectures/pdfs/";
const directUrl = f => BASE + encodeURIComponent(f);
const viewerUrl = f => "https://docs.google.com/viewer?url=" + encodeURIComponent(directUrl(f)) + "&embedded=false";
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const SUBJECTS = [
  { name: "احصاء تطبيقي", icon: "📊", lectures: [
    { title: "محاضرة 1 — مفاهيم أساسية في علم الإحصاء",        file: "محاضرة_1_-_مفاهيم_أساسية_في_علم_الإحصاء.pdf" },
    { title: "محاضرة 2 — تصنيف البيانات وتبويبها",              file: "محاضرة_2_-_تصنيف_البيانات_وتبويبها.pdf" },
    { title: "محاضرة 3 — طرق عرض البيانات",                    file: "محاضرة_3_-_طرق_عرض_البيانات.pdf" },
    { title: "محاضرة 4 — طرق عرض البيانات باستخدام الاكسل",    file: "محاضرة_4_-_طرق_عرض_البيانات_باستخدام_الاكسل.pdf" },
    { title: "محاضرة 5 — مقاييس النزعة المركزية",               file: "محاضرة_5_-_مقاييس_النزعة_المركزية.pdf" },
  ]},
  { name: "محاسبة ضريبية", icon: "🧾", lectures: [
    { title: "محاضرة 1 — المحاسبة الضريبية (الفرقة الرابعة)",   file: "الفرقة_الرابعة_-_المحاسبة_الضريبية_.pdf" },
    { title: "محاضرة 2 — دخل الشخص الطبيعي من المرتبات",       file: "المحاضرة_الثانية-_المحاسبة_الضريبية.pdf" },
    { title: "محاضرة 3 — محاسبة ضريبية",                        file: "المحاضرة_الثالثة_-_محاسبة_ضريبية.pdf" },
  ]},
  { name: "مبادئ المالية العامة", icon: "🏛️", lectures: [
    { title: "الأسبوع 2 — الفصل التمهيدي",        file: "االاسبوع_2__فصل_التمهيدى_ماليةعامة.pdf" },
    { title: "الأسبوع 3 — الفصل الأول",            file: "االاسبوع_3__الفصل_الاول_ماليةعامة.pdf" },
    { title: "الأسبوع 4 — الفصل الأول (تابع)",     file: "االاسبوع_4__الفصل_الاول_ماليةعامة.pdf" },
    { title: "الأسبوع 5 — الفصل الثاني",           file: "االاسبوع_5__الفصل_الثاني_ماليةعامة.pdf" },
  ]},
  { name: "المحاسبة المالية المتقدمة", icon: "📈", lectures: [
    { title: "محاضرة 1 — توصيف المقرر وتكوين شركات الأشخاص",  file: "المحاضرة_الأولى_-_محاسبة_مالية_متقدمة.pdf" },
    { title: "محاضرة 1 — تكوين شركات الأشخاص (نسخة أخرى)",   file: "المحاضرة_الأولى-_محاسبة_مالية_متقدمة.pdf" },
    { title: "محاضرة 2 — الحصة العينية وتكوين الشركات",       file: "المحاضرة_-_الثانية_محاسبة_مالية_متقدمة.pdf" },
  ]},
  { name: "المراجعة", icon: "🔍", lectures: [
    { title: "محاضرة 1 — المفاهيم الأساسية للمراجعة الخارجية", file: "المحاضرة_الأولى__مادة_المراجعة_-1.pdf" },
    { title: "محاضرة 2 — أنواع المراجعة وأهدافها",             file: "المحاضرة_الثانية___مادة_المراجعة_.pdf" },
    { title: "محاضرة 3 — مادة المراجعة",                       file: "المحاضرة_الثالثة__مادة_المراجعة_-2.pdf" },
  ]},
];

let activeSubject = -1; // -1 = all
const $q = document.getElementById("q");
const $main = document.getElementById("main");
const $chips = document.getElementById("chips");

function parseTitle(t, i) {
  const m = t.match(/^(محاضرة|الأسبوع)\s*(\d+)\s*—\s*(.+)$/);
  return m ? { kind: m[1] === "الأسبوع" ? "أسبوع" : "محاضرة", n: m[2], name: m[3] }
           : { kind: "محاضرة", n: i + 1, name: t };
}

function renderChips() {
  const items = [{ name: "الكل" }, ...SUBJECTS];
  $chips.innerHTML = items.map((s, i) =>
    `<button class="chip" data-i="${i - 1}" aria-pressed="${i - 1 === activeSubject}">${esc(s.name)}</button>`
  ).join("");
}
$chips.addEventListener("click", e => {
  const b = e.target.closest(".chip"); if (!b) return;
  activeSubject = +b.dataset.i; renderChips(); render();
});

function render() {
  const q = $q.value.trim().toLowerCase();
  let total = 0, html = "";
  SUBJECTS.forEach((sub, si) => {
    if (activeSubject !== -1 && activeSubject !== si) return;
    const list = sub.lectures.filter(l => !q || l.title.toLowerCase().includes(q) || sub.name.toLowerCase().includes(q));
    if (!list.length) return;
    total += list.length;
    html += `<details class="subject" open>
      <summary>
        <span class="s-icon">${sub.icon}</span>
        <span class="s-name">${esc(sub.name)}</span>
        <span class="s-count">${list.length} محاضرة</span>
        <svg class="s-caret" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="m6 9 6 6 6-6"/></svg>
      </summary>`;
    list.forEach((lec, i) => {
      const p = parseTitle(lec.title, i);
      html += `<div class="lec">
        <div class="num"><b>${esc(p.n)}</b><span>${p.kind}</span></div>
        <div class="title">${esc(p.name)}</div>
        <div class="acts">
          <a class="btn primary" href="${viewerUrl(lec.file)}" target="_blank" rel="noopener">عرض</a>
          <a class="btn" href="${directUrl(lec.file)}" target="_blank" rel="noopener" download>تحميل</a>
          <button class="btn" data-pdf="${esc(directUrl(lec.file))}">لخّص بالذكاء الاصطناعي</button>
        </div>
      </div>`;
    });
    html += `</details>`;
  });
  $main.innerHTML = total ? html
    : `<div class="empty"><b>مفيش نتايج</b>جرّب كلمة تانية أو اختار "الكل".</div>`;
}
$q.addEventListener("input", render);

/* AI menu */
function closeMenu() { document.querySelectorAll(".menu").forEach(m => m.remove()); }
$main.addEventListener("click", e => {
  const btn = e.target.closest("[data-pdf]"); if (!btn) return;
  e.stopPropagation(); closeMenu();
  const prompt = `لخّص لي هذه المحاضرة بشكل منظم:\n• أهم النقاط والمفاهيم الرئيسية\n• الأمثلة والتطبيقات المذكورة\n\n${btn.dataset.pdf}`;
  const menu = document.createElement("div");
  menu.className = "menu";
  menu.innerHTML = `<small>افتح التلخيص في</small>
    <a href="https://claude.ai/new?q=${encodeURIComponent(prompt)}" target="_blank" rel="noopener">Claude</a>
    <a href="https://chatgpt.com/?q=${encodeURIComponent(prompt)}" target="_blank" rel="noopener">ChatGPT</a>`;
  document.body.appendChild(menu);
  const r = btn.getBoundingClientRect(), h = menu.offsetHeight, w = menu.offsetWidth;
  const top = innerHeight - r.bottom > h + 8 ? r.bottom + 6 : r.top - h - 6;
  const left = Math.min(Math.max(8, r.left + r.width / 2 - w / 2), innerWidth - w - 8);
  menu.style.top = Math.max(8, top) + "px"; menu.style.left = left + "px";
});
document.addEventListener("click", closeMenu);
document.addEventListener("keydown", e => { if (e.key === "Escape") closeMenu(); });
addEventListener("scroll", closeMenu, { passive: true });

/* Theme toggle */
const root = document.documentElement;
try { const t = localStorage.getItem("theme"); if (t) root.dataset.theme = t; } catch (_) {}
document.getElementById("themeBtn").addEventListener("click", () => {
  const dark = root.dataset.theme ? root.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
  root.dataset.theme = dark ? "light" : "dark";
  try { localStorage.setItem("theme", root.dataset.theme); } catch (_) {}
});

renderChips(); render();
</script>
</body>
</html>
