<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>8/8</title>
<style>
:root {
  --bg: #0f1117;
  --surface: #1a1d27;
  --card: #22263a;
  --border: #2e3350;
  --accent: #4f7ef8;
  --accent2: #7c5cbf;
  --text: #e8eaf6;
  --muted: #8b90b8;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Segoe UI', Tahoma, Arial, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }

header {
  background: linear-gradient(135deg, #1a1d27, #1e2238);
  border-bottom: 1px solid var(--border);
  padding: 18px 24px;
  display: flex; align-items: center; gap: 14px;
  position: sticky; top: 0; z-index: 100;
}
.logo { width: 42px; height: 42px; background: linear-gradient(135deg, var(--accent), var(--accent2)); border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 20px; }
.site-title { font-size: 1.2rem; font-weight: 700; }
.site-sub { font-size: 0.76rem; color: var(--muted); margin-top: 2px; }

.container { max-width: 960px; margin: 0 auto; padding: 26px 18px 60px; }

.search-wrap { position: relative; margin-bottom: 22px; }
.search-wrap input { width: 100%; background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 11px 44px 11px 16px; color: var(--text); font-size: 0.9rem; font-family: inherit; outline: none; transition: border-color .2s; direction: rtl; }
.search-wrap input:focus { border-color: var(--accent); }
.search-wrap input::placeholder { color: var(--muted); }
.search-icon { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--muted); font-size: 17px; pointer-events: none; }

.subject-block { margin-bottom: 30px; }
.subject-header { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
.subject-icon { width: 36px; height: 36px; background: linear-gradient(135deg, var(--accent), var(--accent2)); border-radius: 9px; display: flex; align-items: center; justify-content: center; font-size: 16px; flex-shrink: 0; }
.subject-name { font-size: 1rem; font-weight: 700; }
.subject-count { font-size: 0.75rem; color: var(--muted); margin-top: 1px; }

.lectures-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 10px; }
.lecture-card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 14px; display: flex; align-items: flex-start; gap: 11px; }
.pdf-icon { width: 38px; height: 38px; flex-shrink: 0; background: rgba(79,126,248,.12); border-radius: 9px; display: flex; align-items: center; justify-content: center; font-size: 19px; }
.lecture-info { flex: 1; min-width: 0; }
.lecture-name { font-size: 0.88rem; font-weight: 600; line-height: 1.4; }
.lecture-actions { display: flex; gap: 6px; margin-top: 8px; }
.btn-sm { display: inline-flex; align-items: center; gap: 4px; padding: 5px 12px; border-radius: 6px; font-size: 0.75rem; font-weight: 600; cursor: pointer; border: none; font-family: inherit; text-decoration: none; transition: opacity .2s; }
.btn-sm:hover { opacity: .8; }
.btn-view { background: rgba(79,126,248,.18); color: var(--accent); }
.btn-dl { background: rgba(124,92,191,.18); color: #a78bfa; }

.empty { text-align: center; padding: 60px 20px; color: var(--muted); }

/* Modal */
.modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.75); z-index: 200; align-items: center; justify-content: center; }
.modal-overlay.open { display: flex; }
.modal { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; width: 95vw; max-width: 860px; max-height: 93vh; display: flex; flex-direction: column; overflow: hidden; }
.modal-head { display: flex; align-items: center; justify-content: space-between; padding: 14px 18px; border-bottom: 1px solid var(--border); flex-shrink: 0; }
.modal-title { font-weight: 700; font-size: 0.95rem; }
.modal-close { background: none; border: none; cursor: pointer; color: var(--muted); font-size: 20px; transition: color .15s; }
.modal-close:hover { color: var(--text); }
.modal-body { flex: 1; overflow: hidden; min-height: 0; }
.modal-body iframe { width: 100%; height: 100%; border: none; display: block; min-height: 60vh; }
.modal-foot { padding: 11px 18px; border-top: 1px solid var(--border); display: flex; gap: 8px; flex-shrink: 0; }
.btn { display: inline-flex; align-items: center; gap: 6px; padding: 8px 16px; border-radius: 8px; font-size: 0.86rem; font-weight: 600; cursor: pointer; border: none; font-family: inherit; text-decoration: none; transition: opacity .2s; }
.btn:hover { opacity: .85; }
.btn-primary { background: var(--accent); color: #fff; }
.btn-ghost { background: var(--card); color: var(--text); border: 1px solid var(--border); }

@media (max-width: 480px) {
  .lectures-grid { grid-template-columns: 1fr; }
  .modal { border-radius: 0; width: 100vw; max-height: 100dvh; }
}
</style>
</head>
<body>

<header>
  <div class="logo">📚</div>
  <div>
    <div class="site-title">محاضرات يوسف</div>
    <div class="site-sub">المعهد المصري لأكاديمية الإسكندرية — الفرقة الرابعة محاسبة</div>
  </div>
</header>

<div class="container">
  <div class="search-wrap">
    <input type="text" placeholder="ابحث عن محاضرة..." id="searchInput" oninput="render()">
    <span class="search-icon">🔍</span>
  </div>
  <div id="main"></div>
</div>

<div class="modal-overlay" id="modal" onclick="closeModal(event)">
  <div class="modal">
    <div class="modal-head">
      <span class="modal-title" id="modalTitle">—</span>
      <button class="modal-close" onclick="closeModal()">✕</button>
    </div>
    <div class="modal-body">
      <iframe id="modalFrame" src=""></iframe>
    </div>
    <div class="modal-foot">
      <a id="modalDl" href="#" download class="btn btn-primary">⬇️ تحميل PDF</a>
      <button class="btn btn-ghost" onclick="closeModal()">إغلاق</button>
    </div>
  </div>
</div>

<script>
const SUBJECTS = [
  {
    name: "احصاء تطبيقي",
    icon: "📊",
    lectures: [
      { title: "محاضرة 1 — مفاهيم أساسية في علم الإحصاء", file: "محاضرة_1_-_مفاهيم_أساسية_في_علم_الإحصاء.pdf" },
      { title: "محاضرة 2 — تصنيف البيانات وتبويبها", file: "محاضرة_2_-_تصنيف_البيانات_وتبويبها.pdf" },
      { title: "محاضرة 3 — طرق عرض البيانات", file: "محاضرة_3_-_طرق_عرض_البيانات.pdf" },
      { title: "محاضرة 4 — طرق عرض البيانات باستخدام الاكسل", file: "محاضرة_4_-_طرق_عرض_البيانات_باستخدام_الاكسل.pdf" },
      { title: "محاضرة 5 — مقاييس النزعة المركزية", file: "محاضرة_5_-_مقاييس_النزعة_المركزية.pdf" },
    ]
  },
  {
    name: "محاسبة ضريبية",
    icon: "🧾",
    lectures: [
      { title: "محاضرة 1 — المحاسبة الضريبية (الفرقة الرابعة)", file: "الفرقة_الرابعة_-_المحاسبة_الضريبية_.pdf" },
      { title: "محاضرة 2 — دخل الشخص الطبيعي من المرتبات", file: "المحاضرة_الثانية-_المحاسبة_الضريبية.pdf" },
      { title: "محاضرة 3 — محاسبة ضريبية", file: "المحاضرة_الثالثة_-_محاسبة_ضريبية.pdf" },
    ]
  },
  {
    name: "مبادئ المالية العامة",
    icon: "🏛️",
    lectures: [
      { title: "الأسبوع 2 — الفصل التمهيدي", file: "االاسبوع_2__فصل_التمهيدى_ماليةعامة.pdf" },
      { title: "الأسبوع 3 — الفصل الأول", file: "االاسبوع_3__الفصل_الاول_ماليةعامة.pdf" },
      { title: "الأسبوع 4 — الفصل الأول (تابع)", file: "االاسبوع_4__الفصل_الاول_ماليةعامة.pdf" },
      { title: "الأسبوع 5 — الفصل الثاني", file: "االاسبوع_5__الفصل_الثاني_ماليةعامة.pdf" },
    ]
  },
  {
    name: "المحاسبة المالية المتقدمة",
    icon: "📈",
    lectures: [
      { title: "محاضرة 1 — توصيف المقرر وتكوين شركات الأشخاص", file: "المحاضرة_الأولى_-_محاسبة_مالية_متقدمة.pdf" },
      { title: "محاضرة 1 — تكوين شركات الأشخاص (نسخة أخرى)", file: "المحاضرة_الأولى-_محاسبة_مالية_متقدمة.pdf" },
      { title: "محاضرة 2 — الحصة العينية وتكوين الشركات", file: "المحاضرة_-_الثانية_محاسبة_مالية_متقدمة.pdf" },
    ]
  },
  {
    name: "المراجعة",
    icon: "🔍",
    lectures: [
      { title: "محاضرة 1 — المفاهيم الأساسية للمراجعة الخارجية", file: "المحاضرة_الأولى__مادة_المراجعة_-1.pdf" },
      { title: "محاضرة 2 — أنواع المراجعة وأهدافها", file: "المحاضرة_الثانية___مادة_المراجعة_.pdf" },
      { title: "محاضرة 3 — مادة المراجعة", file: "المحاضرة_الثالثة__مادة_المراجعة_-2.pdf" },
    ]
  },
];

function p(file) { return "pdfs/" + encodeURIComponent(file); }

function render() {
  const q = document.getElementById("searchInput").value.trim().toLowerCase();
  const main = document.getElementById("main");
  main.innerHTML = "";
  let total = 0;

  SUBJECTS.forEach(sub => {
    const filtered = sub.lectures.filter(l =>
      !q || l.title.toLowerCase().includes(q) || sub.name.toLowerCase().includes(q)
    );
    if (!filtered.length) return;
    total += filtered.length;

    const block = document.createElement("div");
    block.className = "subject-block";
    block.innerHTML = `
      <div class="subject-header">
        <div class="subject-icon">${sub.icon}</div>
        <div>
          <div class="subject-name">${sub.name}</div>
          <div class="subject-count">${filtered.length} محاضرة</div>
        </div>
      </div>
      <div class="lectures-grid"></div>
    `;
    const grid = block.querySelector(".lectures-grid");
    filtered.forEach(lec => {
      const path = p(lec.file);
      const card = document.createElement("div");
      card.className = "lecture-card";
      card.innerHTML = `
        <div class="pdf-icon">📄</div>
        <div class="lecture-info">
          <div class="lecture-name">${lec.title}</div>
          <div class="lecture-actions">
            <button class="btn-sm btn-view" onclick="openModal('${lec.title}', '${path}')">👁 عرض</button>
            <a class="btn-sm btn-dl" href="${path}" download="${lec.file}">⬇️ تحميل</a>
          </div>
        </div>
      `;
      grid.appendChild(card);
    });
    main.appendChild(block);
  });

  if (!total) {
    main.innerHTML = `<div class="empty"><div style="font-size:44px">🔍</div><div>مفيش نتايج</div></div>`;
  }
}

function openModal(title, path) {
  document.getElementById("modalTitle").textContent = title;
  document.getElementById("modalFrame").src = path;
  document.getElementById("modalDl").href = path;
  document.getElementById("modal").classList.add("open");
}

function closeModal(e) {
  if (e && e.target !== document.getElementById("modal")) return;
  document.getElementById("modal").classList.remove("open");
  document.getElementById("modalFrame").src = "";
}

render();
</script>
</body>
</html>
