<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>8/8</title>
<meta name="description" content="محاضرات الفرقة الرابعة محاسبة — المعهد المصري لأكاديمية الإسكندرية">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap">
<style>
:root{
  --bg:#f0f2f8; --card:#fff; --border:#e1e5f2; --text:#1a1d2e; --muted:#6b7199;
  --accent:#3a5bd9; --accent2:#6b42c4; --soft:rgba(58,91,217,.10); --soft2:rgba(107,66,196,.12);
  --shadow:0 4px 18px rgba(40,50,110,.08); --shadow-h:0 10px 28px rgba(58,91,217,.18);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0f1117; --card:#1a1e2e; --border:#2a3050; --text:#e8eaf6; --muted:#8b90b8;
    --accent:#6b8bff; --accent2:#a184ee; --soft:rgba(107,139,255,.14); --soft2:rgba(161,132,238,.16);
    --shadow:0 4px 18px rgba(0,0,0,.3); --shadow-h:0 10px 28px rgba(0,0,0,.45);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0f1117; --card:#1a1e2e; --border:#2a3050; --text:#e8eaf6; --muted:#8b90b8;
  --accent:#6b8bff; --accent2:#a184ee; --soft:rgba(107,139,255,.14); --soft2:rgba(161,132,238,.16);
  --shadow:0 4px 18px rgba(0,0,0,.3); --shadow-h:0 10px 28px rgba(0,0,0,.45);
  color-scheme:dark;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Cairo','Segoe UI',Tahoma,Arial,sans-serif;background:var(--bg);color:var(--text);line-height:1.6}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1000px;margin:0 auto;padding-inline:max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-left,0px))}

/* Hero */
.hero{
  background:linear-gradient(135deg,#2b3fb0 0%,#4a3cb8 55%,#6b42c4 100%);
  color:#fff;padding:calc(28px + env(safe-area-inset-top,0px)) 0 74px;position:relative;overflow:hidden;
}
.hero::after{
  content:"";position:absolute;width:340px;height:340px;border-radius:50%;
  left:-90px;top:-130px;background:rgba(255,255,255,.07);
}
.hero::before{
  content:"";position:absolute;width:220px;height:220px;border-radius:50%;
  left:120px;bottom:-120px;background:rgba(255,255,255,.05);
}
.hero .wrap{position:relative;z-index:1}
.top{display:flex;align-items:center;justify-content:space-between}
.brand{display:flex;align-items:center;gap:12px}
.logo{
  width:46px;height:46px;border-radius:14px;background:rgba(255,255,255,.18);
  backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;font-size:23px;
}
.theme{
  width:42px;height:42px;border-radius:12px;border:1px solid rgba(255,255,255,.25);
  background:rgba(255,255,255,.12);color:#fff;font-size:18px;cursor:pointer;
}
.theme:hover{background:rgba(255,255,255,.22)}
.brand-t{font-size:1.5rem;font-weight:900;line-height:1.1;direction:ltr;text-align:right;letter-spacing:.02em}
.brand-s{font-size:.8rem;opacity:.8;margin-top:2px}
.stats{display:flex;gap:10px;margin-top:22px;flex-wrap:wrap}
.stat{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.2);border-radius:12px;padding:8px 16px;font-size:.85rem}
.stat b{font-size:1.15rem;font-weight:900;margin-inline-end:6px}

/* Search + chips */
.tools{margin-top:-30px;position:relative;z-index:5}
.search{position:relative;display:block}
.search input{
  width:100%;height:56px;padding:0 54px 0 18px;border-radius:16px;border:1.5px solid var(--border);
  background:var(--card);color:var(--text);font:inherit;font-size:1rem;box-shadow:var(--shadow);
}
.search input::placeholder{color:var(--muted)}
.search input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 4px var(--soft)}
.search svg{position:absolute;right:18px;top:50%;transform:translateY(-50%);width:20px;height:20px;color:var(--muted)}
.chips{display:flex;gap:8px;margin-top:16px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{
  flex-shrink:0;padding:8px 18px;border-radius:999px;border:1.5px solid var(--border);
  background:var(--card);color:var(--text);font:inherit;font-size:.88rem;font-weight:600;cursor:pointer;transition:.15s;
}
.chip:hover{border-color:var(--accent)}
.chip[aria-pressed="true"]{background:linear-gradient(135deg,var(--accent),var(--accent2));border-color:transparent;color:#fff}

/* Subjects */
main{padding-block:10px 80px}
.subject{margin-top:30px}
.s-head{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.s-icon svg{width:24px;height:24px}
.s-icon{
  width:44px;height:44px;border-radius:13px;flex-shrink:0;color:var(--accent);
  background:linear-gradient(135deg,var(--soft),var(--soft2));display:flex;align-items:center;justify-content:center;
}
.s-name{font-size:1.15rem;font-weight:800}
.s-count{font-size:.78rem;color:var(--muted);font-weight:600}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:14px}

.card{
  background:var(--card);border:1.5px solid var(--border);border-radius:18px;padding:16px;
  box-shadow:var(--shadow);transition:transform .18s,box-shadow .18s,border-color .18s;
  display:flex;flex-direction:column;gap:14px;
}
.card:hover{transform:translateY(-3px);box-shadow:var(--shadow-h);border-color:var(--accent)}
.c-top{display:flex;gap:12px;align-items:flex-start}
.badge{
  min-width:50px;height:50px;border-radius:14px;flex-shrink:0;color:#fff;
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.1;
}
.badge b{font-size:1.25rem;font-weight:900}
.badge span{font-size:.6rem;opacity:.9;font-weight:600}
.c-title{font-size:.95rem;font-weight:700;line-height:1.55;padding-top:2px}
.acts{display:flex;gap:8px}
.btn{
  flex:1;display:inline-flex;align-items:center;justify-content:center;gap:6px;height:40px;
  border-radius:11px;border:none;font:inherit;font-size:.82rem;font-weight:700;
  text-decoration:none;cursor:pointer;white-space:nowrap;transition:opacity .15s;
}
.btn:hover{opacity:.8}
.btn svg{width:16px;height:16px}
.b-view{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff}
.b-dl{background:var(--soft);color:var(--accent)}
.b-ai{background:var(--soft2);color:var(--accent2);flex:0 0 auto;padding:0 14px}

.empty{text-align:center;padding:70px 16px;color:var(--muted)}
.empty .big{font-size:46px}
.empty b{display:block;color:var(--text);font-size:1.1rem;margin-top:6px}

.menu{
  position:fixed;z-index:100;min-width:210px;background:var(--card);color:var(--text);
  border:1.5px solid var(--border);border-radius:16px;box-shadow:0 14px 40px rgba(0,0,0,.28);overflow:hidden;
}
.menu small{display:block;padding:12px 16px 4px;color:var(--muted);font-size:.74rem;font-weight:700}
.menu a{display:flex;align-items:center;gap:10px;padding:12px 16px;color:inherit;text-decoration:none;font-weight:700;font-size:.9rem}
.menu a:hover{background:var(--soft)}
.menu a svg{flex-shrink:0;display:block}

@media (max-width:600px){.grid{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<section class="hero">
  <div class="wrap">
    <div class="top">
      <div class="brand"><div class="logo">📚</div><div><h1 class="brand-t">8/8</h1><div class="brand-s">المعهد المصري لأكاديمية الإسكندرية، الفرقة الرابعة محاسبة</div></div></div>
      <button class="theme" id="themeBtn" aria-label="تبديل الوضع الداكن">🌓</button>
    </div>
    <div class="stats" id="stats"></div>
  </div>
</section>

<div class="wrap tools">
  <label class="search">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    <input type="search" id="q" placeholder="ابحث عن محاضرة أو مادة..." autocomplete="off">
  </label>
  <div class="chips" id="chips"></div>
</div>

<main class="wrap" id="main"></main>

<script>
const BASE = "https://youssefashraf50.github.io/lectures/pdfs/";
const directUrl = f => BASE + encodeURIComponent(f);
const viewerUrl = f => "https://docs.google.com/viewer?url=" + encodeURIComponent(directUrl(f)) + "&embedded=false";
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const SUBJECTS = [
  { name: "احصاء تطبيقي", icon: "stat", lectures: [
    { title: "محاضرة 1 — مفاهيم أساسية في علم الإحصاء",        file: "محاضرة_1_-_مفاهيم_أساسية_في_علم_الإحصاء.pdf" },
    { title: "محاضرة 2 — تصنيف البيانات وتبويبها",              file: "محاضرة_2_-_تصنيف_البيانات_وتبويبها.pdf" },
    { title: "محاضرة 3 — طرق عرض البيانات",                    file: "محاضرة_3_-_طرق_عرض_البيانات.pdf" },
    { title: "محاضرة 4 — طرق عرض البيانات باستخدام الاكسل",    file: "محاضرة_4_-_طرق_عرض_البيانات_باستخدام_الاكسل.pdf" },
    { title: "محاضرة 5 — مقاييس النزعة المركزية",               file: "محاضرة_5_-_مقاييس_النزعة_المركزية.pdf" },
  ]},
  { name: "محاسبة ضريبية", icon: "tax", lectures: [
    { title: "محاضرة 1 — المحاسبة الضريبية (الفرقة الرابعة)",   file: "الفرقة_الرابعة_-_المحاسبة_الضريبية_.pdf" },
    { title: "محاضرة 2 — دخل الشخص الطبيعي من المرتبات",       file: "المحاضرة_الثانية-_المحاسبة_الضريبية.pdf" },
    { title: "محاضرة 3 — محاسبة ضريبية",                        file: "المحاضرة_الثالثة_-_محاسبة_ضريبية.pdf" },
  ]},
  { name: "مبادئ المالية العامة", icon: "gov", lectures: [
    { title: "الأسبوع 2 — الفصل التمهيدي",        file: "االاسبوع_2__فصل_التمهيدى_ماليةعامة.pdf" },
    { title: "الأسبوع 3 — الفصل الأول",            file: "االاسبوع_3__الفصل_الاول_ماليةعامة.pdf" },
    { title: "الأسبوع 4 — الفصل الأول (تابع)",     file: "االاسبوع_4__الفصل_الاول_ماليةعامة.pdf" },
    { title: "الأسبوع 5 — الفصل الثاني",           file: "االاسبوع_5__الفصل_الثاني_ماليةعامة.pdf" },
  ]},
  { name: "المحاسبة المالية المتقدمة", icon: "acc", lectures: [
    { title: "محاضرة 1 — توصيف المقرر وتكوين شركات الأشخاص",  file: "المحاضرة_الأولى_-_محاسبة_مالية_متقدمة.pdf" },
    { title: "محاضرة 2 — الحصة العينية وتكوين الشركات",       file: "المحاضرة_-_الثانية_محاسبة_مالية_متقدمة.pdf" },
  ]},
  { name: "المراجعة", icon: "audit", lectures: [
    { title: "محاضرة 1 — المفاهيم الأساسية للمراجعة الخارجية", file: "المحاضرة_الأولى__مادة_المراجعة_-1.pdf" },
    { title: "محاضرة 2 — أنواع المراجعة وأهدافها",             file: "المحاضرة_الثانية___مادة_المراجعة_.pdf" },
    { title: "محاضرة 3 — مادة المراجعة",                       file: "المحاضرة_الثالثة__مادة_المراجعة_-2.pdf" },
  ]},
];

const SUBJ_ICONS = {
  stat:'<path d="M5 20V11M11 20V4M17 20v-6M3 20h18"/>',
  tax:'<path d="M6 3h12v18l-3-2-3 2-3-2-3 2z"/><circle cx="9.5" cy="9.5" r="1"/><circle cx="14.5" cy="14.5" r="1"/><path d="m15 9-6 6"/>',
  gov:'<path d="M3 10 12 4l9 6"/><path d="M5 10v8M9.5 10v8M14.5 10v8M19 10v8M3 20h18"/>',
  acc:'<path d="M3 17l6-6 4 4 8-8"/><path d="M15 7h6v6"/>',
  audit:'<circle cx="11" cy="11" r="6.5"/><path d="m20 20-4.2-4.2"/><path d="m8.5 11 1.8 1.8 3.2-3.4"/>'
};
const subjIcon = k => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${SUBJ_ICONS[k]||''}</svg>`;

let activeSubject = -1;
const $q = document.getElementById("q"), $main = document.getElementById("main"), $chips = document.getElementById("chips");

const ICON_EYE = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>';
const ICON_DL  = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11m0 0-4-4m4 4 4-4M5 20h14"/></svg>';

function parseTitle(t, i) {
  const m = t.match(/^(محاضرة|الأسبوع)\s*(\d+)\s*—\s*(.+)$/);
  return m ? { kind: m[1] === "الأسبوع" ? "أسبوع" : "محاضرة", n: m[2], name: m[3] }
           : { kind: "محاضرة", n: i + 1, name: t };
}

function renderStats() {
  const n = SUBJECTS.reduce((a, s) => a + s.lectures.length, 0);
  document.getElementById("stats").innerHTML =
    `<div class="stat"><b>${SUBJECTS.length}</b>مواد</div><div class="stat"><b>${n}</b>محاضرة</div>`;
}
function renderChips() {
  const items = [{ name: "الكل" }, ...SUBJECTS];
  $chips.innerHTML = items.map((s, i) =>
    `<button class="chip" data-i="${i - 1}" aria-pressed="${i - 1 === activeSubject}">${esc(s.name)}</button>`).join("");
}
$chips.addEventListener("click", e => {
  const b = e.target.closest(".chip"); if (!b) return;
  activeSubject = +b.dataset.i; renderChips(); render();
});

function render() {
  const q = $q.value.trim().toLowerCase();
  let total = 0, html = "";
  SUBJECTS.forEach((sub, si) => {
    if (activeSubject !== -1 && activeSubject !== si) return;
    const list = sub.lectures.filter(l => !q || l.title.toLowerCase().includes(q) || sub.name.toLowerCase().includes(q));
    if (!list.length) return;
    total += list.length;
    html += `<section class="subject">
      <div class="s-head">
        <div class="s-icon">${subjIcon(sub.icon)}</div>
        <div><div class="s-name">${esc(sub.name)}</div><div class="s-count">${list.length} محاضرة</div></div>
      </div><div class="grid">`;
    list.forEach((lec, i) => {
      const p = parseTitle(lec.title, sub.lectures.indexOf(lec));
      html += `<article class="card">
        <div class="c-top">
          <div class="badge"><b>${esc(p.n)}</b><span>${p.kind}</span></div>
          <div class="c-title">${esc(p.name)}</div>
        </div>
        <div class="acts">
          <a class="btn b-view" href="${viewerUrl(lec.file)}" target="_blank" rel="noopener">${ICON_EYE}عرض</a>
          <a class="btn b-dl" href="${directUrl(lec.file)}" target="_blank" rel="noopener" download>${ICON_DL}تحميل</a>
          <button class="btn b-ai" data-pdf="${esc(directUrl(lec.file))}" aria-label="لخّص بالذكاء الاصطناعي">✨ لخّص</button>
        </div>
      </article>`;
    });
    html += `</div></section>`;
  });
  $main.innerHTML = total ? html
    : `<div class="empty"><div class="big">🔍</div><b>مفيش نتايج</b>جرّب كلمة تانية أو اختار "الكل".</div>`;
}
$q.addEventListener("input", render);

/* AI menu */
function closeMenu() { document.querySelectorAll(".menu").forEach(m => m.remove()); }
$main.addEventListener("click", e => {
  const btn = e.target.closest("[data-pdf]"); if (!btn) return;
  e.stopPropagation(); closeMenu();
  const prompt = `لخّص لي هذه المحاضرة بشكل منظم:\n• أهم النقاط والمفاهيم الرئيسية\n• الأمثلة والتطبيقات المذكورة\n\n${btn.dataset.pdf}`;
  const menu = document.createElement("div");
  menu.className = "menu";
  menu.innerHTML = `<small>اختار الـ AI</small>
    <a href="https://claude.ai/new?q=${encodeURIComponent(prompt)}" target="_blank" rel="noopener"><svg viewBox="0 0 24 24" width="30" height="30"><rect width="24" height="24" rx="7" fill="#D97757"/><g stroke="#fff" stroke-width="1.7" stroke-linecap="round" transform="translate(12 12) scale(.72) translate(-12 -12)"><path d="M12.00 9.40L12.00 3.40"/><path d="M13.30 9.75L15.10 6.63"/><path d="M14.25 10.70L19.10 7.90"/><path d="M14.60 12.00L18.40 12.00"/><path d="M14.25 13.30L19.62 16.40"/><path d="M13.30 14.25L15.10 17.37"/><path d="M12.00 14.60L12.00 20.40"/><path d="M10.70 14.25L9.00 17.20"/><path d="M9.75 13.30L4.55 16.30"/><path d="M9.40 12.00L5.60 12.00"/><path d="M9.75 10.70L4.90 7.90"/><path d="M10.70 9.75L8.90 6.63"/></g></svg>Claude</a>
    <a href="https://chatgpt.com/?q=${encodeURIComponent(prompt)}" target="_blank" rel="noopener"><svg viewBox="0 0 24 24" width="30" height="30"><rect width="24" height="24" rx="7" fill="#10a37f"/><g fill="none" stroke="#fff" stroke-width="1.3" transform="translate(12 12) scale(.8) translate(-12 -12)"><rect x="9.3" y="3.4" width="5.4" height="8.8" rx="2.7" transform="rotate(0 12 12)"/><rect x="9.3" y="3.4" width="5.4" height="8.8" rx="2.7" transform="rotate(60 12 12)"/><rect x="9.3" y="3.4" width="5.4" height="8.8" rx="2.7" transform="rotate(120 12 12)"/><rect x="9.3" y="3.4" width="5.4" height="8.8" rx="2.7" transform="rotate(180 12 12)"/><rect x="9.3" y="3.4" width="5.4" height="8.8" rx="2.7" transform="rotate(240 12 12)"/><rect x="9.3" y="3.4" width="5.4" height="8.8" rx="2.7" transform="rotate(300 12 12)"/></g></svg>ChatGPT</a>`;
  document.body.appendChild(menu);
  const r = btn.getBoundingClientRect(), h = menu.offsetHeight, w = menu.offsetWidth;
  const top = innerHeight - r.bottom > h + 8 ? r.bottom + 6 : r.top - h - 6;
  const left = Math.min(Math.max(8, r.left + r.width / 2 - w / 2), innerWidth - w - 8);
  menu.style.top = Math.max(8, top) + "px"; menu.style.left = left + "px";
});
document.addEventListener("click", closeMenu);
document.addEventListener("keydown", e => { if (e.key === "Escape") closeMenu(); });
addEventListener("scroll", closeMenu, { passive: true });

/* Theme */
const root = document.documentElement;
try { const t = localStorage.getItem("theme"); if (t) root.dataset.theme = t; } catch (_) {}
document.getElementById("themeBtn").addEventListener("click", () => {
  const dark = root.dataset.theme ? root.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
  root.dataset.theme = dark ? "light" : "dark";
  try { localStorage.setItem("theme", root.dataset.theme); } catch (_) {}
});

/* محاضرات الكلاس روم (بتتضاف تلقائي في lectures.json) */

function normalizeLectureText(value) {
  return String(value || "")
    .toLowerCase()
    .replace(/\.pdf$/i, "")
    .replace(/[\u064B-\u065F\u0670]/g, "")
    .replace(/[أإآ]/g, "ا")
    .replace(/[ىي]/g, "ي")
    .replace(/[_\-—–()[\]]/g, " ")
    .replace(/[^\p{L}\p{N}\s]/gu, " ")
    .replace(/\s+/g, " ")
    .trim();
}

function getLectureNumber(title) {
  const t = normalizeLectureText(title);
  const m = t.match(/(?:محاضرة|المحاضرة|الأسبوع|الاسبوع)\s*(\d+)|(?:محاضرة|المحاضرة)\s*(الأولى|الاولى|الثانية|الثالثة|الرابعة|الخامسة)/);
  if (!m) return "";

  if (m[1]) return m[1];

  const numbers = {
    "الأولى": "1", "الاولى": "1",
    "الثانية": "2", "الثالثة": "3",
    "الرابعة": "4", "الخامسة": "5"
  };
  return numbers[m[2]] || "";
}

async function loadAuto() {
  try {
    const r = await fetch(
      "https://youssefashraf50.github.io/lectures/lectures.json?v=" + Date.now(),
      { cache: "no-store" }
    );

    if (!r.ok) return;

    const d = await r.json();

    (d.items || []).forEach(it => {
      if (!it.subject || !it.file) return;

      // Ignore old generic records with no useful lecture title.
      if (normalizeLectureText(it.title) === "محاضرة") return;

      let subject = SUBJECTS.find(s => s.name === it.subject);

      if (!subject) {
        subject = {
          name: it.subject,
          icon: "acc",
          lectures: []
        };
        SUBJECTS.push(subject);
      }

      const newFile = normalizeLectureText(
        it.file.replace(/_[A-Za-z0-9-]{8,}(?=\.pdf$)/i, "")
      );
      const newTitle = normalizeLectureText(it.title);
      const newNumber = getLectureNumber(it.title);

      const duplicate = subject.lectures.some(existing => {
        const oldFile = normalizeLectureText(
          existing.file.replace(/_[A-Za-z0-9-]{8,}(?=\.pdf$)/i, "")
        );

        const oldTitle = normalizeLectureText(existing.title);
        const oldNumber = getLectureNumber(existing.title);

        // Same file or same normalized title.
        if (oldFile === newFile || oldTitle === newTitle) {
          return true;
        }

        // Same subject and lecture/week number.
        // Helps catch titles that differ between the website and Classroom.
        return newNumber && oldNumber && newNumber === oldNumber;
      });

      if (!duplicate) {
        subject.lectures.push({
          title: it.title,
          file: it.file
        });
      }
    });

    renderStats();
    renderChips();
    render();
  } catch (error) {
    console.error("تعذر تحميل المحاضرات التلقائية:", error);
  }
}
renderStats(); renderChips(); render();
loadAuto();
</script>
</body>
</html>
